version: "0.6.0"
kind: app
app:
  name: ТЗ → OpenAPI
  mode: advanced-chat
  description: Забирает из чата файл и комментарий и передаёт их в сервис.
  icon: "\U0001F4C4"
  icon_type: emoji
  icon_background: "#E0F2FE"
  use_icon_as_answer_icon: false
dependencies: []
workflow:
  conversation_variables: []
  environment_variables:
    - description: Базовый адрес сервиса openapi-from-spec
      id: env-service-url
      name: OPENAPI_SERVICE_URL
      selector:
        - env
        - OPENAPI_SERVICE_URL
      value: http://host.docker.internal:8090
      value_type: string
  features:
    file_upload:
      enabled: true
      allowed_file_types:
        - document
      allowed_file_extensions:
        - .md
        - .txt
        - .markdown
      allowed_file_upload_methods:
        - local_file
        - remote_url
      number_limits: 1
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
          - local_file
          - remote_url
    opening_statement: Приложите файл ТЗ в формате .md или .txt и напишите комментарий.
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ""
      voice: ""
  graph:
    edges:
      - data: {isInIteration: false, isInLoop: false, sourceType: start, targetType: http-request}
        id: start-http
        source: start
        sourceHandle: source
        target: http
        targetHandle: target
        type: custom
      - data: {isInIteration: false, isInLoop: false, sourceType: http-request, targetType: answer}
        id: http-answer
        source: http
        sourceHandle: source
        target: answer
        targetHandle: target
        type: custom
    nodes:
      - data:
          desc: ""
          title: Start
          type: start
          variables: []
        id: start
        position: {x: 80, y: 282}
        sourcePosition: right
        targetPosition: left
        type: custom
      - data:
          authorization:
            config: null
            type: no-auth
          body:
            data:
              - file: [sys, files]
                id: file-field
                key: file
                type: file
                value: ""
              - file: []
                id: clarification-field
                key: clarification
                type: text
                value: "{{#sys.query#}}"
            type: form-data
          desc: ""
          headers: ""
          method: post
          params: ""
          retry_config:
            enabled: false
            max_retries: 1
            retry_interval: 1000
          timeout:
            connect: 10
            max_connect_timeout: 10
            max_read_timeout: 600
            max_write_timeout: 600
            read: 600
            write: 600
          title: Передать в сервис
          type: http-request
          url: "{{#env.OPENAPI_SERVICE_URL#}}/v1/convert"
        id: http
        position: {x: 380, y: 282}
        sourcePosition: right
        targetPosition: left
        type: custom
      - data:
          answer: "{{#http.files#}}{{#http.body#}}"
          desc: ""
          title: Ответ сервиса
          type: answer
          variables: []
        id: answer
        position: {x: 680, y: 282}
        sourcePosition: right
        targetPosition: left
        type: custom
    viewport:
      x: 0
      y: 0
      zoom: 0.8
